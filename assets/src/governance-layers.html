<!doctype html><html><head><meta charset="utf-8"><style>
* { box-sizing:border-box; margin:0; padding:0; }
:root { --ink:#16181d; --blue:#2f6fd0; --red:#e0402f; }
body { background:#e9e9e6; font-family:'Microsoft YaHei','SimHei',sans-serif; color:var(--ink); }
.page { padding:22px; }
.board { position:relative; width:1300px; padding:44px 50px 38px; background:#f6f6f3; border:16px solid #d8d8d3; border-radius:30px; box-shadow: inset 0 0 0 3px #bfbfb9, inset 0 0 70px rgba(0,0,0,.045); }
.head { position:relative; text-align:center; padding:0 40px; }
.title { font-size:80px; font-weight:900; letter-spacing:-2px; line-height:1.02; text-shadow:3px 3px 0 rgba(22,24,29,.10); }
.subtitle { margin-top:12px; font-size:34px; font-weight:700; letter-spacing:1px; }
.subtitle em { font-style:normal; color:var(--blue); }
.rows { position:relative; margin-top:30px; }
.row { position:relative; height:172px; margin-bottom:40px; }
.row:last-child { margin-bottom:0; }
.band { position:absolute; inset:0; background:var(--ink); }
.band-in { position:absolute; inset:3.5px; background:#fdfdfb; }
.row.alt .band-in { background:#f0f0ed; }
.icon { position:absolute; left:46px; top:50%; transform:translateY(-50%) rotate(-2deg); }
.nm { position:absolute; left:186px; top:50%; transform:translateY(-50%); width:440px; }
.nm .line { display:flex; align-items:baseline; gap:10px; width:fit-content; border-bottom:7px solid var(--blue); padding-bottom:6px; transform:rotate(-.35deg); }
.nm .n { font-size:40px; font-weight:900; color:var(--blue); }
.nm .t { font-size:44px; font-weight:900; letter-spacing:-.5px; }
.nm .sub { margin-top:9px; font-size:21px; font-weight:700; color:#6b6f78; }
.tag { position:absolute; right:12px; top:50%; width:566px; transform:translateY(-50%) rotate(.45deg); background:#fff; border:3.5px solid var(--ink); border-radius:10px; padding:13px 18px; box-shadow:5px 5px 0 rgba(22,24,29,.12); }
.tag::before { content:''; position:absolute; left:-13px; top:50%; width:17px; height:17px; margin-top:-8.5px; background:#fff; border-left:3.5px solid var(--ink); border-bottom:3.5px solid var(--ink); transform:rotate(45deg) skew(-6deg,-6deg); }
.tag .l { font-size:24.5px; line-height:1.36; }
.tag .l:first-child { font-weight:800; }
.tag .l + .l { margin-top:5px; color:#3c4048; }
.tag .k { color:var(--blue); }
.tag .r { color:var(--red); }
.tag .g { color:var(--red); font-weight:800; }
.arrow { position:absolute; left:44%; bottom:-30px; transform:translateX(-50%); z-index:3; }
.foot { margin-top:26px; text-align:center; font-size:26px; font-weight:700; color:#4a4d55; }
.foot b { color:var(--ink); }
.deco { position:absolute; }
</style></head><body>
